openapi: 3.1.0
info:
  title: Fusion Platform Backend API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Check backend liveness
      responses:
        '200':
          description: Backend process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/trades:
    get:
      summary: List all trades
      responses:
        '200':
          description: Complete trade collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
        '503':
          description: Trade collection is not ready
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    const: Trade collection is not ready
components:
  schemas:
    Trade:
      type: object
      required:
        - id
        - symbol
        - quantity
        - price
        - side
        - trader
        - tradeDate
        - status
      properties:
        id:
          type: string
        symbol:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          exclusiveMinimum: 0
        side:
          type: string
          enum: [BUY, SELL]
        trader:
          type: string
        tradeDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
        book:
          type: string
        counterparty:
          type: string
