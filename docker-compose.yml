services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:5-24-trixie
    container_name: fusion_platform_workspace
    command: sleep infinity
    volumes:
      - .:/workspaces/fusion_platform:cached

  database:
    build:
      context: ./database
      dockerfile: Dockerfile.dev
    image: fusion-platform-database:16-alpine
    container_name: fusion_platform_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fusion_platform
      SEED_TRADES: ${SEED_TRADES:-true}
      SEED_TRADES_COUNT: ${SEED_TRADES_COUNT:-500}
    env_file:
      - ./backend/.env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fusion_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fusion_platform_backend
    restart: on-failure
    ports:
      - "4001:4001"
    volumes:
      - ${BACKEND_SOURCE_PATH:-./backend}:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env.dev
    command: sh -c "npm ci && npm run debug"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fusion_platform_frontend
    restart: on-failure
    ports:
      - "3001:5173"
    volumes:
      - ${FRONTEND_SOURCE_PATH:-./frontend}:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env.dev
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
